name: Deploy

on:
  # push:
  #   branches: [main]   # Uncomment on VM cutover — see docs/migration/from-supabase.md Stage 9
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Existing ghcr.io sha tag to roll back/forward to"
        required: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  build-and-push:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        env:
          IMAGE_TAG_INPUT: ${{ inputs.image_tag }}
          GH_SHA: ${{ github.sha }}
        run: echo "value=${IMAGE_TAG_INPUT:-sha-$GH_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/team-beacon-slu/idsms-cis:${{ steps.tag.outputs.value }}
            ghcr.io/team-beacon-slu/idsms-cis:stable
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.tag }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_SSH_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          envs: IMAGE_TAG
          script: |
            set -euo pipefail
            cd /opt/idsms
            echo "IMAGE_TAG=$IMAGE_TAG" > .env.deploy
            docker compose --env-file .env.deploy pull app
            docker compose --env-file .env.deploy up -d --wait
