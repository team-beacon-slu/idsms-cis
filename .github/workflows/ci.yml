name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Placeholder values so `prisma validate` and `next build` don't fail on
      # missing env vars. No real secrets are used or needed for a build-only
      # check — applies to every step in this job, not just the build step,
      # since prisma validate needs DATABASE_URL to just be *defined*.
      NEXTAUTH_SECRET: "ci-build-placeholder"
      NEXTAUTH_URL: "http://localhost:3000"
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
      GEMINI_API_KEY: "ci-build-placeholder"
      RESEND_API_KEY: "ci-build-placeholder"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Prisma schema validate
        run: npx prisma validate

      - name: Build
        run: npm run build
