name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Prisma schema validate
        run: npx prisma validate

      - name: Build
        run: npm run build
        env:
          # Placeholder values so `next build` doesn't fail on missing env vars.
          # No real secrets are used or needed for a build-only check.
          NEXTAUTH_SECRET: "ci-build-placeholder"
          NEXTAUTH_URL: "http://localhost:3000"
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
          GEMINI_API_KEY: "ci-build-placeholder"
          RESEND_API_KEY: "ci-build-placeholder"
